<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090914"><title>NEX AI</title><style>
:root{--bg:#090914;--p:#111121;--p2:#18182c;--line:#292944;--t:#f4f2ff;--m:#a6a3c2;--v:#8b5cf6}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#24154b 0,transparent 38%),var(--bg);color:var(--t);font-family:system-ui,sans-serif}.app{max-width:850px;margin:auto;min-height:100vh;padding:14px;display:flex;flex-direction:column}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:10px 0 16px}.brand{display:flex;gap:10px;align-items:center}.logo{background:linear-gradient(135deg,var(--v),#28c5ec);border-radius:14px;padding:10px 15px;font-weight:bold}.brand h1{margin:0}.brand small,.hint,.notice{color:var(--m);font-size:12px}.status{font-size:12px;color:#a7f3d0;background:#123329;padding:8px;border-radius:20px}.toolbar{display:flex;gap:9px;padding:14px 0}select,button,textarea{font:inherit}select{flex:1;background:var(--p2);color:var(--t);border:1px solid var(--line);padding:12px;border-radius:12px}button{cursor:pointer}#newChat{background:var(--p2);border:1px solid var(--line);color:var(--t);border-radius:12px;padding:10px}.settings{background:var(--p);border:1px solid var(--line);border-radius:14px;padding:12px}.chat{flex:1;min-height:48vh;display:flex;flex-direction:column;gap:12px;padding:16px 0}.welcome{text-align:center;margin:auto;padding:30px 10px}.welcome p{color:var(--m);line-height:1.8}.msg{max-width:90%;padding:12px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8}.user{align-self:flex-start;background:#49328a}.assistant{align-self:flex-end;background:var(--p2);border:1px solid var(--line)}.error{color:#ff9aa9}.composer{position:sticky;bottom:0;background:var(--bg);padding:10px 0}.composebox{display:flex;gap:8px;background:var(--p);border:1px solid var(--line);border-radius:16px;padding:8px}textarea{flex:1;resize:none;background:transparent;color:var(--t);border:0;outline:0;padding:10px;min-height:44px}.send{background:linear-gradient(135deg,var(--v),#327fe8);color:white;border:0;border-radius:12px;width:46px;font-size:20px}.actions{display:flex;justify-content:space-between;color:var(--m);font-size:12px;padding:8px}.textbtn{background:none;border:0;color:var(--m)}.notice{text-align:center;padding:8px}
</style></head><body><div class="app"><header><div class="brand"><div class="logo">N</div><div><h1>NEX AI</h1><small>قدرت‌گرفته از Groq</small></div></div><div class="status" id="status">در حال اتصال...</div></header>
<div class="toolbar"><select id="model"><option value="openai/gpt-oss-120b">GPT OSS 120B</option><option value="openai/gpt-oss-20b">GPT OSS 20B</option><option value="llama-3.3-70b-versatile">Llama 3.3 70B (اگر در Groq فعال باشد)</option></select><button id="newChat">＋ گفت‌وگوی جدید</button></div>
<details class="settings"><summary>⚙️ تنظیمات اتصال</summary><p class="hint">کلید API توسط مدیر سرور در بخش Environment Variables سایت Render تنظیم می‌شود و در این صفحه نمایش داده نمی‌شود.</p></details>
<main class="chat" id="chat"><div class="welcome" id="welcome"><div style="font-size:40px">✦</div><h2>به NEX AI خوش آمدی</h2><p>مدل را انتخاب کن و گفت‌وگو را شروع کن.</p></div></main>
<div class="composer"><div class="composebox"><textarea id="prompt" rows="1" placeholder="پیامت را اینجا بنویس..."></textarea><button class="send" id="send">➤</button></div><div class="actions"><span id="typing">آماده گفت‌وگو</span><button class="textbtn" id="clear">پاک کردن گفتگو</button></div></div><div class="notice">NEX AI · نسخه میزبانی ابری</div></div>
<script>
const $=id=>document.getElementById(id);let history=[];
async function ping(){try{let r=await fetch('/api/health');let d=await r.json();$('status').textContent=r.ok?(d.configured?'● سرور آماده':'کلید API تنظیم نشده'):'خطای سرور'}catch{$('status').textContent='سرور وصل نیست'}}
function add(role,content){$('welcome')?.remove();let el=document.createElement('div');el.className='msg '+role;el.textContent=content;$('chat').appendChild(el);$('chat').scrollTop=$('chat').scrollHeight;return el}
async function send(){let text=$('prompt').value.trim();if(!text)return;$('prompt').value='';add('user',text);history.push({role:'user',content:text});$('send').disabled=true;$('typing').textContent='در حال دریافت پاسخ...';let b=add('assistant','در حال فکر کردن...');try{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history,model:$('model').value})});let d=await r.json();if(!r.ok)throw Error(d.error||'خطای ناشناخته');b.textContent=d.reply;history.push({role:'assistant',content:d.reply})}catch(e){b.textContent='خطا: '+e.message;b.classList.add('error');history.pop()}finally{$('send').disabled=false;$('typing').textContent='آماده'}}
function clear(){history=[];$('chat').innerHTML='<div class="welcome" id="welcome"><h2>گفت‌وگوی تازه</h2><p>پیامت را بنویس و شروع کن.</p></div>'}
$('send').onclick=send;$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('clear').onclick=clear;$('newChat').onclick=clear;ping();
</script></body></html>
